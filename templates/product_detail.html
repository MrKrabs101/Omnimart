<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ product.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Omnimart</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/cart">Cart 🛒</a>
    </nav>
  </header>

  <!-- Product Detail -->
  <div class="product-detail" style="display: flex; gap: 40px; padding: 40px;">
    <img src="{{ product.image_url or 'https://via.placeholder.com/300?text=No+Image' }}"
         alt="{{ product.title }}"
         style="max-width: 400px; object-fit: contain;"
         onerror="this.onerror=null;this.src='https://via.placeholder.com/300?text=No+Image';">

    <div class="product-info">
      <h2>{{ product.title }}</h2>
      <p><strong>Brand:</strong> {{ product.brand }}</p>
      <p><strong>Price:</strong> {{ product.currency }} {{ product.final_price }}</p>
      <p><strong>Rating:</strong> {{ product.rating }}</p>
      <p><strong>Description:</strong> {{ product.description or "No description available." }}</p>

      <div class="quantity-controls" style="margin: 20px 0;">
        <button type="button" onclick="changeQty(-1)">➖</button>
        <input type="number" id="qty" value="1" min="1" style="width: 50px; text-align: center;">
        <button type="button" onclick="changeQty(1)">➕</button>
      </div>

      <button onclick="addToCart('{{ product.asin }}')" style="padding: 10px 20px; background-color: #16a085; color: white; border: none; border-radius: 5px;">Add to Cart</button>
      <p id="cart-message" style="margin-top: 10px;"></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/product.js') }}"></script>
</body>
</html>
